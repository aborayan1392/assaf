name: Rased v1.0.9 Artifact Transfer

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  transfer:
    if: startsWith(github.head_ref, 'transfer-rased-v109')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify unsigned APK
        shell: bash
        run: |
          curl -L --fail --retry 3 'https://tempfile.org/hGHrJk8UjRu/download' -o RasedAlBarr-v1.0.9-unsigned.apk
          echo 'a7dd76e427701d7bffe7779704524cedd3e112113e351099296c85aa1b541277  RasedAlBarr-v1.0.9-unsigned.apk' | sha256sum -c -
          unzip -t RasedAlBarr-v1.0.9-unsigned.apk >/dev/null
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RasedAlBarr-v1.0.9-transfer
          path: RasedAlBarr-v1.0.9-unsigned.apk
          if-no-files-found: error
          retention-days: 1

name: Rased v1.0.8 Artifact Transfer

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  transfer:
    if: startsWith(github.head_ref, 'transfer-rased-v108')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Verify APK
        run: |
          test -s RasedAlBarr-v1.0.8-unsigned.apk
          echo '5b9d13333397bc4b14a8067b57a223e7a79c3f46c8055057b170a93feaddc1c8  RasedAlBarr-v1.0.8-unsigned.apk' | sha256sum -c -
          unzip -t RasedAlBarr-v1.0.8-unsigned.apk >/dev/null
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RasedAlBarr-v1.0.8-transfer
          path: RasedAlBarr-v1.0.8-unsigned.apk
          if-no-files-found: error
          retention-days: 1

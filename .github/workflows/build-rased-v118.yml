name: Build Rased v1.0.18

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'build-rased-v118'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-rased-v118

      - name: Reconstruct verified v1.0.13 source
        shell: bash
        run: |
          cat rased-src/project.part* > /tmp/rased-source.b64
          base64 -d /tmp/rased-source.b64 > /tmp/rased-source.zip
          unzip -t /tmp/rased-source.zip >/dev/null
          rm -rf /tmp/rased-unpack && mkdir -p /tmp/rased-unpack
          unzip -q /tmp/rased-source.zip -d /tmp/rased-unpack
          rm -rf rased-albarr
          mv /tmp/rased-unpack/rased-albarr ./rased-albarr
          python3 rased-src/apply_v113.py

      - name: Reapply v1.0.14 field features
        shell: bash
        run: |
          cp v114-files/Observation.kt rased-albarr/app/src/main/java/com/aboryan/rased/albarr/Observation.kt
          cp v114-files/ObservationDb.kt rased-albarr/app/src/main/java/com/aboryan/rased/albarr/ObservationDb.kt
          cp v114-files/BackupManager.kt rased-albarr/app/src/main/java/com/aboryan/rased/albarr/BackupManager.kt
          cp v114-files/ObservationPrintAdapter.kt rased-albarr/app/src/main/java/com/aboryan/rased/albarr/ObservationPrintAdapter.kt
          python3 v114-files/apply_main_v114.py
          python3 - <<'PY'
          from pathlib import Path
          g = Path('rased-albarr/app/build.gradle')
          s = g.read_text().replace('versionCode 13', 'versionCode 14').replace("versionName '1.0.13'", "versionName '1.0.14'")
          if 'dependencies {' not in s:
              s += "\n\ndependencies {\n    implementation 'com.google.zxing:core:3.5.3'\n}\n"
          g.write_text(s)
          m = Path('rased-albarr/app/src/main/AndroidManifest.xml')
          ms = m.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = ms.replace('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n', '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n')
          m.write_text(ms)
          PY

      - name: Reapply v1.0.15 performance improvements
        run: python3 v116-files/apply_v115_performance.py

      - name: Reapply v1.0.16 altitude visibility
        run: python3 v116-files/apply_v116.py

      - name: Reapply v1.0.17 compact cards
        run: python3 v117-files/apply_v117.py

      - name: Apply v1.0.18 precision location patch
        shell: bash
        run: |
          cat v118-files/patch.part* | base64 -d | gzip -d > /tmp/apply_v118.py
          python3 /tmp/apply_v118.py

      - name: Source assertions
        shell: bash
        run: |
          grep -q 'versionCode 18' rased-albarr/app/build.gradle
          grep -q "versionName '1.0.18'" rased-albarr/app/build.gradle
          grep -q 'DB_VERSION = 3' rased-albarr/app/src/main/java/com/aboryan/rased/albarr/ObservationDb.kt
          grep -q 'altitude_accuracy' rased-albarr/app/src/main/java/com/aboryan/rased/albarr/ObservationDb.kt
          grep -q 'AltitudeConverterCompat' rased-albarr/app/src/main/java/com/aboryan/rased/albarr/MainActivity.kt
          grep -q 'GPS دقيق' rased-albarr/app/src/main/java/com/aboryan/rased/albarr/MainActivity.kt
          grep -q 'دقة الارتفاع' rased-albarr/app/src/main/java/com/aboryan/rased/albarr/MainActivity.kt
          grep -q 'core-location-altitude:1.0.0' rased-albarr/app/build.gradle
          grep -q 'android.useAndroidX=true' rased-albarr/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add Cairo font
        shell: bash
        run: |
          mkdir -p rased-albarr/app/src/main/assets/fonts
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o rased-albarr/app/src/main/assets/fonts/Cairo.ttf
          test -s rased-albarr/app/src/main/assets/fonts/Cairo.ttf

      - name: Build release APK
        run: gradle -p rased-albarr :app:assembleRelease --stacktrace

      - name: Verify unsigned APK
        shell: bash
        run: |
          APK='rased-albarr/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          unzip -l "$APK" | grep -q 'assets/fonts/Cairo.ttf'
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: RasedAlBarr-v1.0.18-unsigned
          path: rased-albarr/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
